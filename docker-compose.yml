# Local DEV stack: MySQL 8, Redis 7, MinIO (S3-compatible) and the Go API.
# Usage: scripts/setup-env.ps1 (or .sh) once, then: docker compose up --build   (see docs/runbooks/local-setup.md)
# NOTE: values come from .env (never commit it). Defaults below are DEV-only.
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-tep}
      MYSQL_USER: ${MYSQL_USER:-tep}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set in .env}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports: ["${MYSQL_PORT:-3307}:3306"]
    volumes: ["mysql-data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["${REDIS_PORT:-6379}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set in .env}
    ports: ["${MINIO_PORT:-9000}:9000", "${MINIO_CONSOLE_PORT:-9001}:9001"]
    volumes: ["minio-data:/data"]

  # one-shot: creates the media bucket and lets anyone read objects (images are public; uploads need a presigned URL)
  minio-init:
    image: minio/mc:latest
    depends_on: [minio]
    restart: "no"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set in .env}
      S3_BUCKET: ${S3_BUCKET:-tep-media}
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD; do sleep 1; done;
      mc mb --ignore-existing local/$$S3_BUCKET;
      mc anonymous set download local/$$S3_BUCKET;
      echo bucket ready"

  api:
    build: ./services/api-go
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      APP_ENV: ${APP_ENV:-dev}
      HTTP_ADDR: ":8080"
      API_MODE: ${API_MODE:-db}
      DEMO_DATASET: ${DEMO_DATASET:-true}
      JWT_SECRET: ${JWT_SECRET:?set in .env (>= 32 chars)}
      MOCK_PAYMENT: ${MOCK_PAYMENT:-true}
      MYSQL_DSN: ${MYSQL_USER:-tep}:${MYSQL_PASSWORD}@tcp(mysql:3306)/${MYSQL_DATABASE:-tep}?parseTime=true&charset=utf8mb4
      REDIS_ADDR: redis:6379
      # S3_ENDPOINT must be reachable by the *client* (browser/emulator), not only by the API container
      S3_ENDPOINT: ${S3_ENDPOINT:-http://localhost:9000}
      S3_BUCKET: ${S3_BUCKET:-tep-media}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MIGRATE_ON_START: ${MIGRATE_ON_START:-true}
      MIGRATE_SEED: ${MIGRATE_SEED:-true}
    ports: ["${API_PORT:-8080}:8080"]
    healthcheck:
      test: ["CMD", "/app/api", "-healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  mysql-data:
  minio-data:
